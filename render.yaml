services:
  - type: web
    name: vidyahub
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt && python manage.py migrate --noinput && python manage.py collectstatic --noinput
    startCommand: gunicorn run_combined:combined_app --worker-class eventlet -w 1 --bind 0.0.0.0:$PORT
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.10"
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: AI_SIMULATION_MODE
        value: "False"
      - key: PRODUCTION
        value: "True"
      - key: DATABASE_URL
        fromDatabase:
          name: vidyahub-db
          property: connectionString
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: CEREBRAS_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: WEB_CONCURRENCY
        value: "1"

databases:
  - name: vidyahub-db
    plan: free
    databaseName: vidyahub
    user: vidyahub_user

